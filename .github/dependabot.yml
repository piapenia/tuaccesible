# Dependabot abre pull requests cuando hay que actualizar algo.
# Sirve sobre todo para las acciones de GitHub, que estan fijadas por hash:
# sin esto, el hash se quedaria congelado para siempre, incluido el dia que
# la accion arregle un fallo de seguridad.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
