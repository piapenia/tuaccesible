name: Build, check accessibility, and deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Sin permisos por defecto: cada trabajo pide solo lo suyo, mas abajo.
# Si un paso cualquiera resultara comprometido, el token con el que corre
# no alcanza para escribir en el repositorio.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Las acciones van fijadas al hash del commit y no a la etiqueta: una
      # etiqueta como v4 se puede mover a otro codigo sin que nos enteremos,
      # un hash no. Dependabot los actualiza solo (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No dejar el token de Actions escrito en .git/config del runner.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - name: Contrast check (WCAG 2.x, sobre el CSS real)
        run: npm run verificar:contraste
      - run: npx @11ty/eleventy
      - name: Accessibility check (pa11y-ci, WCAG2AAA)
        run: |
          npx http-server _site -p 8080 &
          npx wait-on http://localhost:8080
          npx pa11y-ci
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
