name: Build, check accessibility, and deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Sin permisos por defecto: cada trabajo pide solo lo suyo, mas abajo.
# Si un paso cualquiera resultara comprometido, el token con el que corre
# no alcanza para escribir en el repositorio.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Las acciones van fijadas al hash del commit y no a la etiqueta: una
      # etiqueta como v4 se puede mover a otro codigo sin que nos enteremos,
      # un hash no. Dependabot los actualiza solo (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No dejar el token de Actions escrito en .git/config del runner.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # La version sale de .nvmrc, el mismo archivo que leen nvm y fnm en
          # las computadoras: CI usa el mismo Node con el que se trabaja. Hoy
          # es 26, la LTS activa desde el 28 de octubre de 2026, con soporte
          # hasta el 30 de abril de 2029. Dependabot no toca ese archivo: el
          # cambio de version es a mano, antes de esa fecha.
          node-version-file: .nvmrc
      - run: npm ci
      # Primero lo que no necesita el sitio compilado: los tests (node:test)
      # y el contraste, que lee public/css/global.css directamente. Si algo
      # falla, se corta antes de compilar.
      - run: npm test
      - name: Contrast check (WCAG 2.x, sobre el CSS real)
        run: npm run verificar:contraste
      - run: npm run build
      - name: Accessibility check (pa11y-ci, WCAG2AAA)
        # wait-on espera a que el servidor responda. Si en un minuto no lo
        # hizo, falla con un mensaje claro en vez de esperar hasta que se
        # agote el tiempo del trabajo.
        run: |
          npx http-server dist -p 8080 &
          npx wait-on --timeout 60s http://localhost:8080
          npx pa11y-ci
      # Desde la v4, esta accion deja fuera todo lo que empieza con punto, y
      # dist/.well-known/security.txt tiene que publicarse. include-hidden-files
      # (desde la v5) lo vuelve a incluir: no se quita esa linea, y en cada
      # version nueva hay que comprobar que /.well-known/security.txt siga
      # respondiendo despues de publicar.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
